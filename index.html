<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Caption & Note Taker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Live Caption & Note Taker</h1>
    <p class="subtitle">Real-time captions and personal note-taking for class</p>
</header>

<main class="container">
    <!-- Live Caption Section (Left/Top) -->
    <section class="card caption-section">
        <div class="card-header">
            <h2>Live Captions</h2>
            <div class="controls">
                <button id="start-btn" class="btn primary">Start Captions</button>
                <button id="stop-btn" class="btn danger" disabled>Stop</button>
            </div>
        </div>
        
        <div id="status" class="status-indicator">Status: Ready</div>
        
        <div id="caption-box" class="caption-display" aria-live="polite">
            <p class="placeholder">Click "Start Captions" and speak into your microphone...</p>
        </div>
        
        <button id="copy-caption-btn" class="btn secondary">Copy Captions to Notes</button>
    </section>

    <!-- Notes Section (Right/Bottom) -->
    <section class="card notes-section">
        <div class="card-header">
            <h2>My Class Notes</h2>
            <button id="clear-notes-btn" class="btn danger-outline">Clear Notes</button>
        </div>

        <div class="notebook-bar">
            <input type="text" id="notebook-title" class="title-input" placeholder="Class or topic title (e.g., Biology 101)">
            <button id="save-notebook-btn" class="btn primary">Save Notebook</button>
            <button id="download-current-btn" class="btn secondary-inline">Download .txt</button>
        </div>

        <div id="save-status" class="save-indicator">Auto-saved</div>
        
        <textarea id="notes-input" placeholder="Type your notes here or copy live captions over..."></textarea>
    </section>

    <!-- Saved Notebooks Section (Full Width Below) -->
    <section class="card saved-notebooks-section">
        <div class="card-header">
            <h2>Saved Notebooks</h2>
        </div>
        <div id="notebooks-list" class="notebooks-list">
            <p class="placeholder">No saved notebooks yet. Save your current notes above to keep them here.</p>
        </div>
    </section>
</main>

<!-- Load scripts in order -->
<script src="data.js"></script>
<script src="2data.js"></script>
<script src="3data.js"></script>
<script src="4data.js"></script>

</body>
</html>
